<!DOCTYPE html>
<html>
  <head>
    <meta charset = "Utf-8">
    <title>Cellfont testing area</title>

    <style>
      * {
        background-color: black;
        margin: 0px;
        padding: 0px;
        border: none;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <canvas id = "C"></canvas>
    <script>
      const canvas = document.getElementById("C");
      const ctx = canvas.getContext("2d");
      const fontimg = new Image();
      fontimg.onload = function() {
        let interval = window.setInterval(render, 17);
      }
      fontimg.src = "https://raw.githubusercontent.com/David66775/Team-Projects/7533ee407d85789a88b402acad040d5c70c8e771/assets/Images/charmap-cellphone_white.png"
      function render() {
        ctx.drawImage(fontimg, 0, 18, 7, 9, 80, 80, 16, 14);
        ctx.drawImage(fontimg, 77, 27, 7, 9, 95, 80, 16, 14);
        ctx.drawImage(fontimg, 98, 36, 7, 9, 110, 80, 16, 14);
        ctx.drawImage(fontimg, 7, 36, 7, 9, 125, 80, 16, 14);
        ctx.drawImage(fontimg, 98, 27, 7, 9, 137, 80, 16, 14);
        ctx.drawImage(fontimg, 28, 9, 7, 9, 152, 80, 16, 14);
        ctx.drawImage(fontimg, 28, 9, 7, 9, 167, 80, 16, 14);
        ctx.drawImage(fontimg, 35, 9, 7, 9, 182, 80, 16, 14);
        ctx.drawImage(fontimg, 35, 9, 7, 9, 197, 80, 16, 14);
        ctx.drawImage(fontimg, 21, 9, 7, 9, 212, 80, 16, 14);
      }
    </script>
  </body>
</html>
