<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content = "noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src = "/Team-Projects/assets/Hyper.js"></script>
    <title>Infinicalc tool</title>

    <style>
      #display {
        width: 750px;
      }
      button {
        width: 50px;
        border-radius: 0px;
        display: block;
        height: 50px;
      }
      span {
        display: flex;
        flex-direction: row;
        margin-bottom: -20px;
      }
      div {
        margin-top: 0px;
        margin-bottom: 0px;
        border-collapse: collapse;
        border-width: 0px;
      }
      h2 {
        margin-bottom: 5px; 
      }
      * {
        border-collapse: collapse;
      }
      input {
        font-size: 20px;
        height: 30px;
      }
      #notepad {
        width: 98%;
        height: 120px;
      }
    </style>
</head>
<body>
    <h1>Infinicalc</h1>
    
    <div>
        <h2>Infinicalc Interface</h2>
        <input type="text" id="display" placeholder="0" readonly>
        <br><br>
        <span>
          <button onclick="appendNumber('7')">7</button>
          <button onclick="appendNumber('8')">8</button>
          <button onclick="appendNumber('9')">9</button>
          <button onclick="setOperation('divide')">÷</button>
          <button onclick="clearDisplay()">C</button>
        </span>
        <br>
        <span>
          <button onclick="appendNumber('4')">4</button>
          <button onclick="appendNumber('5')">5</button>
          <button onclick="appendNumber('6')">6</button>
          <button onclick="setOperation('multiply')">×</button>
          <button onclick="deleteLastChar()">DEL</button>
        </span>
        <br>
        <span>
          <button onclick="appendNumber('1')">1</button>
          <button onclick="appendNumber('2')">2</button>
          <button onclick="appendNumber('3')">3</button>
          <button onclick="setOperation('subtract')">−</button>
          <button onclick="toggleSign()">+/−</button>
        </span>
        <br>
        <span>
          <button onclick="appendNumber('0')">0</button>
          <button onclick="appendDecimal()">.</button>
          <button onclick="calculate()">=</button>
          <button onclick="setOperation('add')">+</button>
          <button onclick="calculateSquareRoot()">√</button>
        </span>
        <br>
        <span>
          <button onclick="setOperation('exponent')">x^y</button>
          <button onclick="calculateFactorial()">!</button>
          <button onclick="calculatePercent()">%</button>
          <button onclick="toggleParentheses('(')">( )</button>
          <button onclick="calculateReciprocal()">1/x</button>
        </span>
    </div>
    <textarea id = "notepad" placeholder = "Notepad"></textarea>
    <script src = "/Team-Projects/infinicalc/main.js"></script>
</body>
</html>
