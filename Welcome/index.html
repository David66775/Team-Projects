<!DOCTYPE html>
<html>
  <head>
    <meta charset = "Utf-8">
    <title>Welcome, New Contributors!</title>
    <script src = "/Team-Projects/assets/Hyper.js"></script>
    
    <style>
      
    </style>
  </head>
  <body>
    <h1>Welcome New Contributors!</h1>
    <h3 id = "a"></h3>
    <p id = "aB"></p>
    <script>
      let HE = document.getElementById("a");
      let RE = document.getElementById("aB");
      fetch('/Team-Projects/assets/Welcome.json')
        .then(response => response.text())
        .then(jsonString => {
        console.log(jsonString);
        const obj = JSON.parse(jsonString);
      });
      let response = "";
      let heading = "";
      response = obj.response;
      heading = obj.heading;
      function d() {
        HE.value = heading;
        if (HE.innerHTML !== heading) {
          HE.text = heading;
        }
        if (HE.innerHTML !== heading) {
          HE.innerHTML = heading;
        }
        RE.value = response;
        if (RE.innerHTML !== response) {
          RE.text = response;
        }
        if (RE.innerHTML !== response) {
          RE.innerHTML = response;
        }
      }
      function run() {
        if (window.location.href !== "https://david66775.github.io/Team-Projects/Welcome" && window.location.href !== "https://david66775.github.io/Team-Projects/Welcome/") {
          alert("You're Busted, Faker! Go on the actual site! Get out!");
          window.open("https://david66775.github.io/Blank", "_self");
          if (window.location.href !== "https://david66775.github.io/Blank") {
            window.location.href = "https://david66775.github.io/Blank";
          }
        }
        d();
      }
      run();
      
    </script>
  </body>
</html>
