name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.hi }}
        issue-message: "Greetings, and welcome, new Programmer."
        pr-message: "Thank you for providing feedback on this repository."
