    <h1>Zingiberaceous</h1>
    <pre>
Weird word, huh? Well, I found this one searching through a Webster Modern Reference Of The English Language book from 1968.
Apparently, according to the dictionary, This word means the following:
-Pertaining to ginger
-To the order of plants of which ginger is the type.
